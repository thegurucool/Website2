<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
:root{
  --black:#111111;
  --orange:#F47B5A;
  --white:#FFFFFF;
  --paper:#FAFAFA;
  --chalk:#F0EDE8;
  --chalk-dim:rgba(240,237,232,0.55);
  --mid:#767676;
  --border:rgba(0,0,0,0.08);
  --scr-bg:#161616;
  --scr-card:#1E1E1E;
  --scr-text:#F0EDE8;
  --scr-muted:rgba(240,237,232,0.7);
  --ruled:rgba(240,237,232,0.05);
}
body{font-family:'Montserrat',sans-serif;background:var(--paper);color:var(--black);overflow-x:hidden;}

/* NAV */
nav{position:fixed;top:0;left:0;right:0;z-index:100;padding:1rem 2.5rem;display:flex;align-items:center;justify-content:space-between;background:#0A0A0A;border-bottom:1px solid rgba(240,237,232,.1);}
.nav-logo{cursor:pointer;text-decoration:none;}
.nav-logo img{height:28px;width:auto;display:block;}
.nav-links{display:flex;align-items:center;gap:2rem;}
.nav-link{text-decoration:none;color:var(--chalk-dim);font-size:.85rem;font-family:'Montserrat',sans-serif;font-weight:400;transition:color .15s;background:none;border:none;cursor:pointer;padding:0;}
.nav-link:hover,.nav-link.active{color:var(--chalk);}
.nav-cta{background:var(--orange);color:#111111!important;padding:.55rem 1.3rem;border-radius:50px;font-weight:600;font-size:.85rem;cursor:pointer;border:none;font-family:'Montserrat',sans-serif;text-decoration:none;display:inline-block;transition:opacity .15s;}
.nav-cta:hover{opacity:.9;}
.nav-login{color:var(--chalk);border:1px solid rgba(240,237,232,.25);padding:.55rem 1.3rem;border-radius:50px;font-weight:600;font-size:.85rem;font-family:'Montserrat',sans-serif;text-decoration:none;display:inline-block;transition:color .15s,border-color .15s;}
.nav-login:hover{border-color:var(--orange);color:var(--orange);}
.nav-burger{display:none;background:none;border:none;cursor:pointer;user-select:none;padding:.4rem;width:38px;height:34px;position:relative;}
.nav-burger::before,.nav-burger::after,.nav-burger>span{content:'';position:absolute;left:.4rem;right:.4rem;height:2px;background:var(--chalk);border-radius:2px;transition:transform .2s,opacity .2s;}
.nav-burger::before{top:.7rem;}
.nav-burger>span{top:1.05rem;}
.nav-burger::after{top:1.4rem;}
#nav-toggle{display:none;}
#nav-toggle:checked ~ .nav-burger::before{top:1.05rem;transform:rotate(45deg);}
#nav-toggle:checked ~ .nav-burger::after{top:1.05rem;transform:rotate(-45deg);}
#nav-toggle:checked ~ .nav-burger>span{opacity:0;}

/* RULED BG */
.ruled-bg{background-image:repeating-linear-gradient(180deg,transparent 0px,transparent 47px,var(--ruled) 47px,var(--ruled) 48px);}

/* REVEAL ANIMATION */
.r{opacity:0;transform:translateY(20px);transition:opacity .65s ease,transform .65s ease;}
.r.in{opacity:1;transform:translateY(0);}

/* SECTION EYEBROW */
.eyebrow{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--orange);display:block;margin-bottom:.8rem;}

/* FOOTER */
footer{background:#0A0A0A;padding:2rem 2.5rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem;}
.footer-logo{display:flex;align-items:center;gap:.75rem;}
.footer-name{font-family:'Montserrat',sans-serif;font-size:1rem;font-style:italic;color:var(--chalk);}
footer p{font-size:.78rem;color:rgba(240,237,232,.6);font-weight:300;}
.footer-links{display:flex;gap:1.5rem;}
.footer-links a,.footer-links button{font-size:.78rem;color:rgba(240,237,232,.65);text-decoration:none;background:none;border:none;font-family:'Montserrat',sans-serif;cursor:pointer;transition:color .15s;}
.footer-links a:hover,.footer-links button:hover{color:var(--chalk);}

/* BUTTONS */
.btn-main{background:var(--orange);color:#111111;border:none;border-radius:50px;padding:.75rem 2rem;font-family:'Montserrat',sans-serif;font-size:.9rem;font-weight:700;cursor:pointer;transition:opacity .15s;text-decoration:none;display:inline-block;}
.btn-main:hover{opacity:.9;}
.sub-hero-cta{display:inline-flex;align-items:center;gap:.5rem;background:var(--orange);color:#111111;border:none;border-radius:50px;padding:.85rem 1.8rem;font-family:'Montserrat',sans-serif;font-size:.92rem;font-weight:700;text-decoration:none;transition:opacity .15s;cursor:pointer;}
.sub-hero-cta:hover{opacity:.9;}
.btn-outline{background:transparent;color:var(--chalk);border:1.5px solid rgba(240,237,232,.3);border-radius:50px;padding:.7rem 1.8rem;font-family:'Montserrat',sans-serif;font-size:.88rem;font-weight:600;cursor:pointer;transition:all .15s;text-decoration:none;display:inline-block;}
.btn-outline:hover{border-color:var(--orange);color:var(--orange);}

/* BLOG CARDS */
.bc{display:flex;flex-direction:column;background:var(--white);border:1px solid rgba(0,0,0,.07);border-radius:12px;overflow:hidden;text-decoration:none;color:var(--black);transition:transform .2s,box-shadow .2s;}
.bc:hover{transform:translateY(-3px);box-shadow:0 8px 30px rgba(0,0,0,.1);}
.bc.big{grid-column:span 1;}
.bc-img{position:relative;height:220px;overflow:hidden;background:var(--black);}
.bc-img img{width:100%;height:100%;object-fit:cover;transition:transform .4s;}
.bc:hover .bc-img img{transform:scale(1.03);}
.bc-tag{position:absolute;top:.75rem;left:.75rem;background:rgba(0,0,0,.6);color:#fff;font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:.2rem .6rem;border-radius:50px;}
.bc-body{padding:1.2rem;flex:1;display:flex;flex-direction:column;gap:.6rem;}
.bc-meta{display:flex;align-items:center;gap:.5rem;font-size:.72rem;color:var(--mid);}
.bc-cat-lbl{color:var(--orange);font-weight:700;text-transform:uppercase;font-size:.68rem;letter-spacing:.5px;}
.bc-sep{width:3px;height:3px;border-radius:50%;background:var(--mid);}
.bc-title{font-size:.95rem;font-weight:700;line-height:1.45;color:var(--black);flex:1;}
.bc-excerpt{font-size:.8rem;color:var(--mid);line-height:1.65;font-weight:300;}
.bc-foot{display:flex;align-items:center;justify-content:space-between;margin-top:.4rem;}
.bc-author-row{display:flex;align-items:center;gap:.4rem;}
.bc-auth-emo{font-size:.9rem;}
.bc-auth-name{font-size:.72rem;color:var(--mid);font-weight:500;}
.bc-arr{color:var(--orange);font-size:1rem;font-weight:700;}

/* SCREEN MOCKUP */
.screen-base{background:var(--scr-bg);border-radius:12px;overflow:hidden;border:1px solid rgba(255,255,255,.08);}
.scr-bar{background:#0F0F0F;padding:.5rem .75rem;display:flex;align-items:center;gap:.5rem;}
.scr-dots{display:flex;gap:.3rem;}
.scr-dot{width:8px;height:8px;border-radius:50%;}
.scr-url{flex:1;background:rgba(255,255,255,.05);border-radius:4px;padding:.2rem .6rem;font-size:.62rem;color:var(--scr-muted);text-align:center;}
.scr-body{display:grid;grid-template-columns:140px 1fr;min-height:360px;}
.scr-sidebar{background:#0F0F0F;padding:.75rem .5rem;border-right:1px solid rgba(255,255,255,.06);}
.scr-nav-item{padding:.45rem .6rem;border-radius:6px;font-size:.7rem;color:var(--scr-muted);display:flex;align-items:center;gap:.4rem;cursor:default;margin-bottom:.2rem;}
.scr-nav-item.active{background:rgba(244,123,90,.12);color:var(--orange);}
.scr-main{padding:.9rem;}
.scr-stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin:-.5rem 0 .8rem;}
.scr-stat{background:var(--scr-card);border-radius:6px;padding:.5rem .4rem;text-align:center;}
.scr-stat-n{font-size:1rem;font-weight:700;color:var(--orange);}
.scr-stat-l{font-size:.56rem;color:var(--scr-muted);margin-top:.1rem;}
.scr-bar-wrap{margin-bottom:.4rem;}
.scr-bar-label{display:flex;justify-content:space-between;font-size:.6rem;color:var(--scr-muted);margin-bottom:.2rem;}
.scr-track{height:5px;background:rgba(255,255,255,.07);border-radius:3px;overflow:hidden;}
.scr-fill{height:100%;background:var(--orange);border-radius:3px;}
.scr-table-head{display:grid;grid-template-columns:1fr 40px 40px 70px;gap:.3rem;font-size:.6rem;color:rgba(240,237,232,.65);text-transform:uppercase;letter-spacing:.4px;padding:.3rem 0;border-bottom:1px solid rgba(255,255,255,.06);margin-bottom:.3rem;}
.scr-table-row{display:grid;grid-template-columns:1fr 40px 40px 70px;gap:.3rem;font-size:.65rem;padding:.35rem 0;border-bottom:1px solid rgba(255,255,255,.04);align-items:center;}
.scr-status{font-size:.58rem;padding:.15rem .4rem;border-radius:50px;text-align:center;font-weight:600;}
.scr-status.on{background:rgba(74,222,128,.12);color:#4ade80;}
.scr-status.off{background:rgba(244,123,90,.12);color:var(--orange);}

/* CHAT SCREEN */
.screen-chat{background:var(--scr-bg);border-radius:12px;overflow:hidden;border:1px solid rgba(255,255,255,.08);}
.sc-topbar{background:#0F0F0F;padding:.5rem .75rem;display:flex;align-items:center;gap:.5rem;border-bottom:1px solid rgba(255,255,255,.06);}
.sc-dots{display:flex;gap:.3rem;}
.sc-avatar{width:22px;height:22px;background:var(--orange);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.65rem;}
.sc-name{font-size:.72rem;font-weight:600;color:var(--scr-text);}
.sc-mode{margin-left:auto;background:rgba(244,123,90,.1);border:1px solid rgba(244,123,90,.2);color:var(--orange);font-size:.6rem;font-weight:700;padding:.15rem .5rem;border-radius:50px;text-transform:uppercase;letter-spacing:.3px;}
.sc-messages{padding:.75rem;display:flex;flex-direction:column;gap:.6rem;min-height:180px;}
.sc-msg-ai{background:var(--scr-card);border-radius:0 8px 8px 8px;padding:.6rem .75rem;font-size:.72rem;color:var(--scr-text);line-height:1.55;max-width:90%;}
.sc-msg-user{background:rgba(244,123,90,.15);border-radius:8px 0 8px 8px;padding:.6rem .75rem;font-size:.72rem;color:var(--scr-text);line-height:1.55;max-width:85%;align-self:flex-end;}
.sc-suggestions{padding:0 .75rem .5rem;display:flex;flex-wrap:wrap;gap:.3rem;}
.sc-suggest{font-size:.62rem;color:var(--orange);background:rgba(244,123,90,.08);border:1px solid rgba(244,123,90,.15);border-radius:50px;padding:.2rem .55rem;cursor:default;}
.sc-input-row{padding:.5rem .75rem;border-top:1px solid rgba(255,255,255,.06);display:flex;gap:.4rem;align-items:center;}
.sc-input{flex:1;background:rgba(255,255,255,.05);border-radius:6px;padding:.35rem .6rem;font-size:.68rem;color:var(--scr-muted);}
.sc-send{background:var(--orange);color:#111111;border:none;border-radius:50%;width:24px;height:24px;font-size:.8rem;cursor:default;display:flex;align-items:center;justify-content:center;}

/* ASSESSMENT SCREEN */
.screen-assessment{background:var(--scr-bg);border-radius:12px;overflow:hidden;border:1px solid rgba(255,255,255,.08);}
.sa-topbar{background:#0F0F0F;padding:.5rem .75rem;display:flex;align-items:center;gap:.5rem;}
.sa-dots{display:flex;gap:.3rem;}
.sa-progress-pill{background:rgba(244,123,90,.15);color:var(--orange);font-size:.62rem;font-weight:700;padding:.2rem .6rem;border-radius:50px;margin-left:auto;}
.sa-body{padding:.9rem;}
.sa-domain-tag{font-size:.62rem;font-weight:700;color:var(--orange);text-transform:uppercase;letter-spacing:.5px;margin-bottom:.6rem;}
.sa-question{font-size:.78rem;color:var(--scr-text);line-height:1.55;margin-bottom:.8rem;font-weight:500;}
.sa-options{display:flex;flex-direction:column;gap:.4rem;}
.sa-opt{display:flex;align-items:center;gap:.5rem;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:7px;padding:.5rem .7rem;font-size:.68rem;color:var(--scr-muted);}
.sa-opt.selected{background:rgba(244,123,90,.12);border-color:rgba(244,123,90,.3);color:var(--scr-text);}
.sa-opt-letter{width:18px;height:18px;border-radius:50%;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;font-size:.6rem;font-weight:700;flex-shrink:0;color:var(--orange);}
.sa-opt.selected .sa-opt-letter{background:var(--orange);color:#111111;}
.sa-footer{padding:.6rem .9rem;background:#0F0F0F;display:flex;align-items:center;justify-content:space-between;}
.sa-counter{font-size:.62rem;color:var(--scr-muted);}
.sa-next-btn{background:var(--orange);color:#111111;border:none;border-radius:50px;padding:.3rem .85rem;font-size:.65rem;font-weight:700;cursor:default;font-family:'Montserrat',sans-serif;}

/* FEAT PANEL */
.feat-panel{display:grid;grid-template-columns:1fr 1fr;gap:4rem;align-items:center;margin-bottom:5rem;}
.feat-panel.reverse{direction:rtl;}
.feat-panel.reverse>*{direction:ltr;}
.fp-num{font-family:'Montserrat',sans-serif;font-style:italic;font-size:3rem;color:rgba(0,0,0,.08);line-height:1;margin-bottom:.5rem;}
.fp-title{font-family:'Montserrat',sans-serif;font-size:1.8rem;font-weight:400;color:var(--black);line-height:1.2;margin-bottom:.75rem;}
.fp-desc{font-size:.9rem;color:var(--mid);line-height:1.75;font-weight:300;margin-bottom:1rem;}
.fp-chips{display:flex;flex-wrap:wrap;gap:.4rem;}
.fp-chip{font-size:.72rem;font-weight:600;color:var(--mid);background:rgba(0,0,0,.05);border-radius:50px;padding:.2rem .65rem;border:1px solid rgba(0,0,0,.08);}
.fp-chip.accent{background:rgba(244,123,90,.08);border-color:rgba(244,123,90,.2);color:var(--orange);}

/* STEP */
.step-circle{width:56px;height:56px;border-radius:50%;margin:0 auto 1.2rem;border:2px solid rgba(0,0,0,.15);display:flex;align-items:center;justify-content:center;font-family:'Montserrat',sans-serif;font-size:1.1rem;font-weight:700;color:var(--black);transition:all .5s ease;background:transparent;}
.step-circle.active{background:var(--orange);border-color:var(--orange);color:#111111;transform:scale(1.1);}

/* FORM */
.email-row{display:flex;gap:0;max-width:420px;}
.email-in{flex:1;padding:.75rem 1rem;border:1.5px solid rgba(0,0,0,.12);border-radius:8px 0 0 8px;font-family:'Montserrat',sans-serif;font-size:.88rem;outline:none;background:var(--white);}
.email-btn{background:var(--orange);color:#111111;border:none;border-radius:0 8px 8px 0;padding:.75rem 1.4rem;font-family:'Montserrat',sans-serif;font-size:.88rem;font-weight:700;cursor:pointer;}

/* CHIP TOGGLE */
.chip{padding:.45rem 1rem;border-radius:50px;border:1.5px solid rgba(0,0,0,.12);font-size:.82rem;font-weight:500;cursor:pointer;background:var(--white);color:#666;transition:all .15s;}
.chip[data-chosen="1"]{background:rgba(244,123,90,.08);border-color:var(--orange);color:var(--orange);font-weight:600;}

/* RESPONSIVE */
@media(max-width:900px){
  nav{padding:.9rem 1.4rem;}
  .nav-burger{display:block;}
  .nav-links{display:none;position:absolute;top:100%;left:0;right:0;flex-direction:column;align-items:stretch;background:#0A0A0A;border-bottom:1px solid rgba(240,237,232,.1);padding:.75rem 1.4rem 1rem;gap:0;}
  .nav-links .nav-link{padding:.85rem 0;font-size:1rem;border-bottom:1px solid rgba(240,237,232,.06);}
  .nav-links .nav-link:last-child{border-bottom:none;}
  .nav-links .nav-login{margin-top:.6rem;text-align:center;padding:.75rem 1.3rem;}
  .nav-links .nav-cta{margin-top:.4rem;text-align:center;padding:.75rem 1.3rem;}
  #nav-toggle:checked ~ .nav-links{display:flex;}
  .feat-panel{grid-template-columns:1fr;gap:2rem;}
  .feat-panel.reverse{direction:ltr;}
}

/* PLATFORM TOGGLE */
.ptoggle-wrap{display:flex;justify-content:center;margin:2.5rem 0 3.5rem;}
.ptoggle-inner{display:inline-flex;background:#F47B5A;border-radius:50px;padding:.3rem;gap:0;box-shadow:0 4px 20px rgba(244,123,90,.35);}
.ptoggle-btn{padding:.55rem 1.5rem;border-radius:50px;border:none;font-family:'Montserrat',sans-serif;font-size:.8rem;font-weight:700;cursor:pointer;transition:all .2s;white-space:nowrap;background:transparent;color:#111111;}
.ptoggle-btn.active{background:#fff;color:#111;box-shadow:0 2px 8px rgba(0,0,0,.12);}

/* BLOG HERO */
.blog-hero{padding:8rem 2.5rem 4rem;background:var(--black);}
.blog-hero-inner{max-width:1160px;margin:0 auto;}
.blog-hero h1{font-family:'Montserrat',sans-serif;font-size:clamp(2.5rem,5vw,4rem);color:var(--chalk);font-weight:400;font-style:italic;line-height:1.1;margin-bottom:1rem;}
.blog-hero h1 em{color:var(--orange);font-style:normal;}
.blog-hero p{font-size:.95rem;color:var(--chalk-dim);font-weight:300;max-width:520px;line-height:1.7;}
.blog-cats{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:2rem;}
.bcat{padding:.4rem 1rem;border-radius:50px;border:1px solid rgba(240,237,232,.2);font-size:.78rem;font-weight:600;cursor:pointer;background:transparent;color:rgba(240,237,232,.5);font-family:'Montserrat',sans-serif;transition:all .15s;}
.bcat.active-cat,.bcat:hover{background:var(--orange);border-color:var(--orange);color:#fff;}
.blog-main{padding:4rem 2.5rem 6rem;}
.blog-main-inner{max-width:1160px;margin:0 auto;}
.blog-featured{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;margin-bottom:3rem;}
.blog-sub-header{margin-bottom:1.5rem;}
.blog-sub-header h3{font-family:'Montserrat',sans-serif;font-size:1.6rem;font-weight:400;font-style:italic;}
.blog-sub-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.2rem;}
@media(max-width:900px){
  .blog-featured{grid-template-columns:1fr;}
  .blog-sub-grid{grid-template-columns:1fr;}
  .blog-hero,.blog-main{padding-left:1.5rem;padding-right:1.5rem;}
}

/* POST PAGE */
.post-hero{background:var(--black);padding:6rem 2.5rem 3rem;}
.post-hero-inner{max-width:760px;margin:0 auto;}
.post-back{display:inline-flex;align-items:center;gap:.5rem;color:rgba(240,237,232,.65);font-size:.82rem;cursor:pointer;border:none;background:none;font-family:'Montserrat',sans-serif;margin-bottom:2rem;padding:0;transition:color .2s;text-decoration:none;}
.post-back:hover{color:var(--orange);}
.post-cat{display:inline-block;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--orange);background:rgba(244,123,90,.1);border:1px solid rgba(244,123,90,.2);padding:.25rem .7rem;border-radius:50px;margin-bottom:1rem;}
.post-title{font-family:'Montserrat',sans-serif;font-size:clamp(1.8rem,4vw,3rem);font-weight:400;color:var(--chalk);line-height:1.2;margin-bottom:.8rem;}
.post-meta{font-size:.8rem;color:rgba(240,237,232,.65);}
.post-thumb{width:100%;max-height:720px;object-fit:cover;display:block;}
.post-body-wrap{max-width:680px;margin:0 auto;padding:3rem 1.75rem 6rem;}
.post-body-wrap h2{font-family:'Montserrat',sans-serif;font-size:1.85rem;font-weight:400;color:var(--black);margin:2.8rem 0 1rem;line-height:1.25;}
.post-body-wrap h3{font-size:1.1rem;font-weight:700;color:var(--black);margin:2rem 0 .75rem;}
.post-body-wrap p{font-size:1.0625rem;line-height:1.75;color:#1f1f1f;margin-bottom:1.4rem;font-weight:400;}
.post-body-wrap strong{font-weight:600;color:var(--black);}
.post-body-wrap ul,.post-body-wrap ol{margin:0 0 1.4rem 1.5rem;}
.post-body-wrap li{font-size:1.0625rem;line-height:1.7;color:#1f1f1f;font-weight:400;margin-bottom:.5rem;}
.post-body-wrap hr{border:none;border-top:1px solid rgba(0,0,0,.08);margin:2rem 0;}
.post-cta{background:var(--black);padding:3.5rem 2.5rem;text-align:center;}
.post-cta h3{font-family:'Montserrat',sans-serif;font-size:1.6rem;font-weight:400;font-style:italic;color:var(--chalk);margin-bottom:.75rem;}
.post-cta p{font-size:.88rem;color:var(--chalk-dim);margin-bottom:1.5rem;max-width:480px;margin-left:auto;margin-right:auto;}

</style>
<style>
/* === Getting Started page === */
.gs-hero{background:var(--black);padding:8rem 2.5rem 4rem;}
.gs-hero-inner{max-width:760px;margin:0 auto;}
.gs-breadcrumb{font-size:.78rem;color:rgba(240,237,232,.55);margin-bottom:1.5rem;font-family:'Montserrat',sans-serif;}
.gs-breadcrumb a{color:rgba(240,237,232,.55);text-decoration:none;transition:color .15s;}
.gs-breadcrumb a:hover{color:var(--orange);}
.gs-breadcrumb .sep{margin:0 .5rem;color:rgba(240,237,232,.2);}
.gs-eyebrow{display:inline-block;background:rgba(244,123,90,.12);border:1px solid rgba(244,123,90,.25);color:var(--orange);font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.8px;padding:.35rem .85rem;border-radius:50px;margin-bottom:1.5rem;font-family:'Montserrat',sans-serif;}
.gs-hero h1{font-family:'Montserrat',sans-serif;font-size:clamp(1.8rem,4vw,2.8rem);font-weight:400;line-height:1.2;color:var(--chalk);margin-bottom:1rem;letter-spacing:-.4px;}
.gs-hero h1 em{font-style:italic;color:var(--orange);}
.gs-hero-sub{font-size:1rem;color:var(--chalk-dim);line-height:1.7;font-weight:300;max-width:520px;}

/* === Guide selector section === */
.gs-section{padding:5rem 2.5rem 6rem;background:var(--paper);}
.gs-inner{max-width:900px;margin:0 auto;}

.gs-step-label{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:#C0461A;margin-bottom:1.5rem;display:block;font-family:'Montserrat',sans-serif;}

/* Guide trigger list */
.gs-list{list-style:none;margin:0 0 2rem;padding:0;display:flex;flex-direction:column;gap:.75rem;}
.gs-list li{margin:0;padding:0;}
.gs-btn{
  width:100%;
  display:flex;
  align-items:center;
  gap:1.2rem;
  padding:1.25rem 1.5rem;
  background:#fff;
  border:1.5px solid rgba(0,0,0,.1);
  border-radius:10px;
  font-family:'Montserrat',sans-serif;
  font-size:.95rem;
  font-weight:500;
  color:#333;
  cursor:pointer;
  text-align:left;
  transition:border-color .15s, box-shadow .15s, color .15s;
  box-shadow:0 2px 8px rgba(0,0,0,.04);
}
.gs-btn:hover{border-color:rgba(255,127,80,.5);box-shadow:0 4px 16px rgba(255,127,80,.12);}
.gs-btn[aria-selected="true"]{
  border-color:#FF7F50;
  color:#FF7F50;
  box-shadow:0 4px 20px rgba(255,127,80,.18);
}
.gs-btn-num{
  flex-shrink:0;
  width:2rem;
  height:2rem;
  border-radius:50%;
  background:rgba(0,0,0,.06);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:.78rem;
  font-weight:700;
  color:#888;
  transition:background .15s, color .15s;
}
.gs-btn[aria-selected="true"] .gs-btn-num{
  background:#FF7F50;
  color:#fff;
}
.gs-btn-text{flex:1;}
.gs-btn-arrow{flex-shrink:0;font-size:.85rem;color:#bbb;transition:color .15s, transform .15s;}
.gs-btn[aria-selected="true"] .gs-btn-arrow{color:#FF7F50;transform:rotate(90deg);}

/* Accordion embed panel */
.gs-item{display:flex;flex-direction:column;}
.gs-embed-wrap{
  display:none;
  margin-top:.5rem;
  border-radius:0 0 10px 10px;
  overflow:hidden;
  border:1.5px solid rgba(255,127,80,.3);
  border-top:none;
}
.gs-embed-wrap.visible{display:block;}
.gs-btn[aria-expanded="true"]{border-radius:10px 10px 0 0;border-bottom-color:transparent;}
.gs-btn[aria-selected="true"]{border-color:#FF7F50;color:#FF7F50;box-shadow:0 4px 20px rgba(255,127,80,.18);}
.gs-btn[aria-expanded="true"].gs-btn[aria-selected="true"]{border-bottom-color:transparent;}
.scribe-embed-wrapper{
  position:relative;
  width:100%;
  min-height:500px;
}
.scribe-embed-wrapper iframe{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  border:0;
  display:block;
}

/* Active nav */
.nav-link.active{color:var(--chalk);}

/* Responsive */
@media(max-width:700px){
  .gs-hero{padding:6rem 1.5rem 3rem;}
  .gs-section{padding:3.5rem 1.5rem 4rem;}
  .gs-btn{padding:1rem 1.2rem;font-size:.88rem;gap:.9rem;}
  .scribe-embed-wrapper{min-height:420px;}
}
</style>
</head>

<script>
function selectGuide(btn) {
  var isOpen = btn.getAttribute('aria-expanded') === 'true';
  var panelId = btn.getAttribute('aria-controls');
  var panel = document.getElementById(panelId);
  var iframe = panel.querySelector('iframe');

  // Close all panels first
  document.querySelectorAll('.gs-btn').forEach(function(b) {
    b.setAttribute('aria-expanded', 'false');
    b.setAttribute('aria-selected', 'false');
  });
  document.querySelectorAll('.gs-embed-wrap').forEach(function(p) {
    p.classList.remove('visible');
    p.querySelector('iframe').src = '';
  });

  // Toggle open if it wasn't already open
  if (!isOpen) {
    btn.setAttribute('aria-expanded', 'true');
    btn.setAttribute('aria-selected', 'true');
    iframe.src = btn.dataset.url;
    panel.classList.add('visible');
    panel.scrollIntoView({behavior: 'smooth', block: 'nearest'});
  }
}
</script>
